name: format-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Show gofmt diff
        run: gofmt -s -d internal/app/actions_coverage_batch17_test.go
