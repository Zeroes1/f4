name: Format debug
on:
  push:
    branches: [codex/actions-coverage-batch15]
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Show gofmt diff
        run: gofmt -s -d internal/app/actions_coverage_batch15_test.go