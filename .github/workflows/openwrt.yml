name: openwrt

# Extra-lite / OpenWrt build (unxed/f4#1671; docs/OPENWRT.md). Builds the lite
# profile for the OpenWrt-relevant Linux architectures, publishes the binaries
# as artifacts with their size and SHA-256 in the job summary, and smoke-tests
# the native one headlessly (scripts/openwrt_smoke.py: panel listing and
# keyboard navigation on a pseudo-terminal, start-up time, peak RSS). Manual
# only: it never gates a merge and never runs on push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mipsle-softfloat, goarch: mipsle, extra: "GOMIPS=softfloat"}
          - {name: arm-v7, goarch: arm, extra: "GOARM=7"}
          - {name: arm64, goarch: arm64, extra: "GOARM64=v8.0"}
          - {name: amd64, goarch: amd64, extra: "GOAMD64=v1"}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          EXTRA: ${{ matrix.extra }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist
          env "$EXTRA" go build -tags lite,vtui_noebiten,vtui_nogogpu -trimpath -ldflags "-s -w" -o "dist/f4-lite-linux-$NAME" ./cmd/f4
          {
            echo "### f4 lite, linux/$NAME"
            echo
            echo '```'
            ls -l "dist/f4-lite-linux-$NAME" | awk '{print $5, $9}'
            sha256sum "dist/f4-lite-linux-$NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check (native build only)
        if: matrix.goarch == 'amd64'
        run: |
          python3 scripts/openwrt_smoke.py dist/f4-lite-linux-amd64 | tee smoke.txt
          {
            echo "### Smoke check"
            echo
            echo '```'
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: f4-lite-linux-${{ matrix.name }}
          path: dist/f4-lite-linux-${{ matrix.name }}
          if-no-files-found: error
