name: ConPTY line-wrap probe

on:
  workflow_dispatch:

jobs:
  system-conpty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report host
        run: |
          New-Item -ItemType Directory -Force -Path probe-out | Out-Null
          $log = "probe-out/host.txt"
          cmd /c ver | Tee-Object -FilePath $log
          "conhost: " + (Get-Item C:\Windows\System32\conhost.exe).VersionInfo.FileVersion | Tee-Object -FilePath $log -Append
          "image:   $env:ImageVersion" | Tee-Object -FilePath $log -Append

      - name: Install pywinpty
        run: pip install pywinpty

      - name: Probe
        run: python tools/conpty_probe.py

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conpty-probe-output
          path: probe-out/
