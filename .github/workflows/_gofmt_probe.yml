name: temporary gofmt probe
on:
  pull_request:
    branches: [main]
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: print diff
        run: gofmt -s -d plugins/cloudfox/yandex_code_prompt_coverage_test.go